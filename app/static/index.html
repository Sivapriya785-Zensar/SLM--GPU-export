<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispute SLM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="wordmark">zensar</div>
        <div class="subtitle">Dispute SLM</div>
      </div>

      <button id="newChatBtn" class="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" />
        </svg>
        New Chat
      </button>

      <button id="settingsBtn" class="settings-btn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19.5a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H4.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.04 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10.6A1.7 1.7 0 0 0 11.64 3.6V4.5a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09c0 .68.4 1.29 1.04 1.56Z" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Model Settings
      </button>

      <svg class="blob-deco" viewBox="0 0 300 300" aria-hidden="true">
        <circle cx="90" cy="150" r="130" fill="#c41230" />
        <circle cx="40" cy="250" r="130" fill="#12203f" />
        <circle cx="190" cy="250" r="80" fill="#c9d2df" opacity=".7" />
      </svg>
    </aside>

    <div class="divider"></div>

    <main class="chat-card">
      <div class="deco-bg" aria-hidden="true">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <circle cx="96" cy="4" r="34" fill="#c41230" opacity=".16" />
          <circle cx="18" cy="82" r="26" fill="#12203f" opacity=".07" />
          <path d="M -10 62 C 20 45, 45 75, 80 40" stroke="#c41230" stroke-width=".4" fill="none" opacity=".35" />
        </svg>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="intro" id="intro"></div>
      </div>

      <form id="composer" class="composer">
        <div class="network-pill">
          <svg class="net-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="12" r="2.4" /><circle cx="18" cy="6" r="2.4" /><circle cx="18" cy="18" r="2.4" />
            <path d="M8.1 10.8 15.9 7.2 M8.1 13.2 15.9 16.8" stroke-linecap="round" />
          </svg>
          <select id="network" required aria-label="Card network">
            <option value="" disabled selected>Select Network</option>
          </select>
          <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>

        <textarea id="input" rows="1" placeholder="Type a message…" required></textarea>

        <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12h15M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </main>
  </div>

  <div id="settingsOverlay" class="settings-overlay" hidden>
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">Model Settings</h2>
        <button id="settingsCloseBtn" class="settings-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <p class="settings-sub">Choose which Ollama model the assistant uses to classify disputes.</p>
      <div class="settings-body">
        <label class="settings-label" for="modelSelect">Ollama model</label>
        <select id="modelSelect" class="settings-select">
          <option value="" disabled selected>Loading models…</option>
        </select>
        <div id="settingsStatus" class="settings-status"></div>
      </div>
      <div class="settings-footer">
        <button id="settingsSaveBtn" class="settings-save-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
